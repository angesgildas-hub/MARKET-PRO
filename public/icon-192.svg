<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <!-- Chart Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Layer (Rounded Square) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Inner Circle Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Stylized M & Growth Arrow -->
  <g filter="url(#shadow)">
    <!-- Main Market Structure (Shop Front + letter M) -->
    <path d="M120 340 L180 200 L256 280 L332 200 L392 340" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shop awning canopy detail -->
    <path d="M140 180h232" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Rising Arrow -->
    <path d="M330 190 L390 130 L410 150 M390 130 L330 130" fill="none" stroke="url(#arrowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Market Pro Text in Monospace typography -->
  <text x="256" y="440" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle" opacity="0.95">MARKET PRO</text>
</svg>
